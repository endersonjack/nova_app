<label class="form-label app-modal-form__label mb-1" for="{{ field.id_for_label }}">
  {{ field.label }}{% if required %}<span class="text-danger" aria-hidden="true"> *</span>{% endif %}
</label>
{{ field }}
{% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
{% for err in field.errors %}<div class="text-danger small">{{ err }}</div>{% endfor %}
