<div data-app-modal-size="sm">
<div class="modal-header border-bottom py-2">
  <h2 class="modal-title h6 mb-0 text-danger" id="appModalLabel">Desativar visitante</h2>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
</div>
<div class="modal-body py-3">
  <p class="mb-1">Deseja desativar o visitante <strong>{{ visitante.nome_completo }}</strong>?</p>
  <p class="text-muted small mb-0">O registro <strong>não será apagado</strong>: o status ficará desativado e deixará de aparecer nas listagens.</p>
  <form method="post"
        class="mt-3"
        hx-post="{% url 'visitantes:delete' visitante.pk %}"
        hx-target="#app-modal-content"
        hx-swap="innerHTML"
        hx-indicator="#app-modal-indicator"
        hx-disabled-elt="find button[type=submit]">
    {% csrf_token %}
    <div class="modal-footer border-top mt-3 px-0 pb-0 pt-3 flex-wrap gap-2">
      <span id="app-modal-indicator" class="htmx-indicator spinner-border spinner-border-sm text-primary me-auto" role="status" aria-hidden="true"></span>
      <button type="button" class="btn btn-app btn-app-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
      <button type="submit" class="btn btn-app btn-app-danger btn-sm px-3">Desativar</button>
    </div>
  </form>
</div>
</div>
