{# Skeleton: total + aniversariantes #}
<div class="row g-4 align-items-stretch placeholder-glow" aria-hidden="true">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm h-100">
      <div class="card-body p-3 p-lg-4">
        <div class="d-flex align-items-center gap-3 mb-3">
          <span class="placeholder rounded-3 flex-shrink-0" style="width: 2.75rem; height: 2.75rem;"></span>
          <div class="flex-grow-1">
            <span class="placeholder col-7 mb-2 rounded-pill d-block" style="height: 1rem; max-width: 14rem;"></span>
            <span class="placeholder col-5 rounded-pill d-block" style="height: 0.65rem; max-width: 10rem;"></span>
          </div>
        </div>
        <span class="placeholder col-12 rounded-3 d-block" style="height: 8rem;"></span>
      </div>
    </div>
  </div>
  <div class="col-md-6 col-lg-7">
    <div class="card border-0 shadow-sm h-100">
      <div class="card-body p-3 p-lg-4">
        <div class="d-flex align-items-center gap-3 mb-3">
          <span class="placeholder rounded-3 flex-shrink-0" style="width: 2.75rem; height: 2.75rem;"></span>
          <div class="flex-grow-1">
            <span class="placeholder col-7 mb-2 rounded-pill d-block" style="height: 1rem; max-width: 14rem;"></span>
            <span class="placeholder col-5 rounded-pill d-block" style="height: 0.65rem; max-width: 10rem;"></span>
          </div>
        </div>
        {% for i in "1234" %}
          <div class="d-flex align-items-center gap-3 py-2 border-bottom border-light">
            <span class="placeholder rounded-3 flex-shrink-0" style="width: 2.3rem; height: 2.3rem;"></span>
            <span class="placeholder rounded-circle flex-shrink-0" style="width: 2.75rem; height: 2.75rem;"></span>
            <div class="flex-grow-1">
              <span class="placeholder rounded-pill col-7 d-block mb-2" style="height: 0.75rem;"></span>
              <span class="placeholder rounded-pill col-5 d-block" style="height: 0.6rem;"></span>
            </div>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
